# Vault API site. Installed by deploy/setup_server.sh as /etc/nginx/sites-available/vault-api.
# certbot --nginx adds the TLS server block and the HTTP->HTTPS redirect.

limit_req_zone $binary_remote_addr zone=vault_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vault_oauth:10m rate=30r/m;
# No query string in the log: ?q= and ?path= would reveal what is searched and read.
log_format vault_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 10m;
    access_log /var/log/nginx/vault_api.log vault_noquery;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST API and the MCP endpoint (/api/vault/mcp)
    location /api/vault/ {
        limit_req zone=vault_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_read_timeout 60s;
    }

    # OAuth for ChatGPT / Claude apps (stricter rate limit: the consent form takes a password)
    location /oauth/ {
        limit_req zone=vault_oauth burst=20 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location / {
        return 404;
    }
}
